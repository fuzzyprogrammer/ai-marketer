# Services
services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-marketer-postgres
    environment:
      POSTGRES_USER: ai_marketer
      POSTGRES_PASSWORD: ai_marketer_dev
      POSTGRES_DB: ai_marketer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_marketer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-marketer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ai-marketer-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # OmniRoute for free-tier model routing (Phase 1 demo)
  omniroute:
    image: ghcr.io/diegosouzapw/omniroute:latest
    container_name: ai-marketer-omniroute
    ports:
      - "20128:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API service
  api:
    build:
      context: ./packages/api
      dockerfile: ../../Dockerfile.api
    container_name: ai-marketer-api
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://ai_marketer:ai_marketer_dev@postgres:5432/ai_marketer
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - BROKER_URL=http://broker:3000
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./packages/api:/app
      - /app/node_modules

  # Broker service
  broker:
    build:
      context: ./packages/broker
      dockerfile: ../../Dockerfile.broker
    container_name: ai-marketer-broker
    ports:
      - "3000:3000"
    environment:
      - OMINROUTE_URL=http://omniroute:8080
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    depends_on:
      redis:
        condition: service_healthy
      omniroute:
        condition: service_healthy
    volumes:
      - ./packages/broker:/app
      - /app/node_modules

  # Render worker
  render-worker:
    build:
      context: ./packages/workers/render-worker
      dockerfile: ../../../Dockerfile.worker
    container_name: ai-marketer-render-worker
    environment:
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - NODE_ENV=development
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./packages/workers/render-worker:/app
      - /app/node_modules
    # Headless Chromium and FFmpeg are installed in the Dockerfile

volumes:
  postgres_data:
  redis_data:
  minio_data:
