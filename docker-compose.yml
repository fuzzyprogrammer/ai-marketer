# Services
services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-marketer-postgres
    env_file:
      - .env.production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_marketer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-marketer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ai-marketer-minio
    env_file:
      - .env.production
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # OmniRoute for free-tier model routing (Phase 1 demo)
  omniroute:
    image: ghcr.io/diegosouzapw/omniroute:latest
    container_name: ai-marketer-omniroute
    ports:
      - "20128:8080"
    environment:
      - PORT=8080

  # API service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ai-marketer-api
    ports:
      - "4000:4000"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql://ai_marketer:ai_marketer_dev@postgres:5432/ai_marketer
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - BROKER_URL=http://broker:3000
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes: []

  # Broker service
  broker:
    build:
      context: .
      dockerfile: Dockerfile.broker
    container_name: ai-marketer-broker
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - OMINROUTE_URL=http://omniroute:8080
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    depends_on:
      redis:
        condition: service_healthy
    volumes: []

  # Render worker
  render-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ai-marketer-render-worker
    env_file:
      - .env.production
    environment:
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - NODE_ENV=development
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes: []
    # Headless Chromium and FFmpeg are installed in the Dockerfile

  # Poster worker
  poster:
    build:
      context: .
      dockerfile: Dockerfile.poster
    container_name: ai-marketer-poster
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql://ai_marketer:ai_marketer_dev@postgres:5432/ai_marketer
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - BROKER_URL=http://broker:3000
      - NODE_ENV=development
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    volumes: []

  # Generator worker
  generator:
    build:
      context: .
      dockerfile: Dockerfile.generator
    container_name: ai-marketer-generator
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql://ai_marketer:ai_marketer_dev@postgres:5432/ai_marketer
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - BROKER_URL=http://broker:3000
      - NODE_ENV=development
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      broker:
        condition: service_started
    volumes: []

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backups: